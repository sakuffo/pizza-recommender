<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Recommender</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Pizza Recommender</h1>
    
    <div class="container">
        <div class="preferences">
            <div class="preference-box">
                <h2>Ingredients You Don't Want</h2>
                <p>Select ingredients you want to avoid:</p>
                <div class="ingredients-list" id="all-ingredients-disliked">
                    <!-- Ingredients will be loaded here by JavaScript -->
                </div>
                <p>Your disliked ingredients:</p>
                <div class="selected-ingredients" id="disliked-ingredients"></div>
            </div>
            
            <div class="preference-box">
                <h2>Ingredients You Prefer</h2>
                <p>Select ingredients you really like:</p>
                <div class="ingredients-list" id="all-ingredients-preferred">
                    <!-- Ingredients will be loaded here by JavaScript -->
                </div>
                <p>Your preferred ingredients:</p>
                <div class="selected-ingredients" id="preferred-ingredients"></div>
            </div>
        </div>
        
        <button id="recommend-btn">Recommend Me Pizzas</button>
        
        <div class="loading" id="loading">Finding the perfect pizzas for you...</div>
        
        <div class="results" id="results"></div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="/static/js/script.js"></script>
</body>
</html>
