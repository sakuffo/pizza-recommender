services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile  # Use the updated Go Dockerfile
    container_name: pizza-backend-service
    restart: unless-stopped
    init: true
    # Port 8080 is used internally for the API, but not exposed to host by default
    # expose:
    #   - "8080"
    networks:
      - pizza-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend # Use the new Nginx Dockerfile
    container_name: pizza-frontend-service
    restart: unless-stopped
    ports:
      - "8000:80" # Map host port 8000 to container port 80 (Nginx default)
    depends_on:
      - backend # Wait for backend to be available (basic check)
    networks:
      - pizza-net

networks:
  pizza-net:
    driver: bridge

# No external services (database, cache, etc.) are required for this project
# No volumes section needed as there is no persistent data
# No networks section needed as there is only one service
