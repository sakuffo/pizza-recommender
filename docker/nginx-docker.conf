server {
    listen 80;
    server_name localhost;

    # Root directory for frontend files inside container
    root /usr/share/nginx/html;

    # Serve index.html as the default file
    index index.html;

    # API Reverse Proxy: Forward requests starting with /api/ to the backend service
    location /api/ {
        # Remove /api/ prefix before forwarding
        rewrite ^/api/(.*)$ /$1 break;
        
        # Proxy to the backend service defined in Docker Compose
        proxy_pass http://backend:8080;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly
    location /static/ {
        try_files $uri $uri/ =404;
    }

    # Handle requests to the root or any path not matching /static/ or /api/
    location / {
        try_files $uri /index.html;
    }
} 