# Inventory file for Pizza Recommender deployment (inside ansible/)
# Replace placeholders with actual IPs and connection details

[backend]
backend-vm ansible_host=<backend_vm_ip> ansible_user=<your_ssh_user> backend_ip_address=<backend_vm_ip> # ansible_ssh_private_key_file=/path/to/your/key

[frontend]
frontend-vm ansible_host=<frontend_vm_ip> ansible_user=<your_ssh_user> # ansible_ssh_private_key_file=/path/to/your/key

[all:vars]
# Define the Git repository URL here
# Ensure the VMs have network access to this repository
# and potentially SSH keys configured if it's a private repo
git_repo_url = "https://your-git-provider.com/user/pizza-mixing.git"
# Define the branch/tag/commit to deploy
git_version = "main" 