# VCF Ubuntu VMs Inventory File
# Update with your actual VM IP addresses or hostnames

[vcf_vms]
# Example single VM
vcf-vm-01 ansible_host=192.168.1.100 ansible_user=ubuntu

# Example multiple VMs
# vcf-vm-01 ansible_host=192.168.1.100 ansible_user=ubuntu
# vcf-vm-02 ansible_host=192.168.1.101 ansible_user=ubuntu
# vcf-vm-03 ansible_host=192.168.1.102 ansible_user=ubuntu

[vcf_vms:vars]
# Common variables for all VCF VMs
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

# Repository configuration (update with your actual repo)
git_repo_url=https://github.com/your-username/pizza-mixing.git
git_branch=main